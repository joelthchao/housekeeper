name: Deploy frontend to GitHub Pages

# 把 frontend/ 這個資料夾發佈到 GitHub Pages。
# 啟用方式：GitHub repo → Settings → Pages → Build and deployment → Source: GitHub Actions。
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 自動啟用 Pages（build_type=workflow），省去手動到 Settings → Pages 開啟。
          # 需 repo 為 public（GitHub 免費方案），且 workflow 有 pages:write 權限。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend
      - id: deployment
        uses: actions/deploy-pages@v4

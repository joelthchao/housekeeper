# Supabase project config: https://supabase.com/docs/guides/local-development/cli/config
project_id = "housekeeper"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
# Local test mailbox (magic-link emails land here).
enabled = true
port = 54324

[auth]
enabled = true
# Local development values. Production auth URLs are set in the Supabase
# dashboard (Authentication -> URL Configuration).
site_url = "http://localhost:8000"
additional_redirect_urls = ["http://localhost:8000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Passwordless magic-link login; no confirmation email step.
enable_confirmations = false

# The frontend is a static site (see frontend/), not an Edge Function.
[functions.line-callback]
verify_jwt = false

[functions.dispatch-notifications]
verify_jwt = false

# Auth handled in-function so CORS preflight is not blocked.
[functions.test-notify]
verify_jwt = false

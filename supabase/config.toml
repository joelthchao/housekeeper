# Supabase 專案設定
# 詳細說明：https://supabase.com/docs/guides/local-development/cli/config
project_id = "housekeeper"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
# 本機測試信箱（Magic Link 登入信會寄到這裡）
enabled = true
port = 54324

[auth]
enabled = true
# 本機開發時的站台 URL；正式環境請在 Supabase Dashboard 設定
site_url = "http://127.0.0.1:54321/functions/v1/web"
additional_redirect_urls = ["http://127.0.0.1:54321/functions/v1/web"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# 極簡：關閉信箱驗證，直接用 Magic Link（OTP）登入
enable_confirmations = false

# --- Edge Functions ---
# web：前端 SPA（公開，不需 JWT 即可 GET）
[functions.web]
verify_jwt = false

# line-callback：LINE Login OAuth 導回（公開）
[functions.line-callback]
verify_jwt = false

# dispatch-notifications：排程推播，由 Cron 帶 service role token 呼叫
[functions.dispatch-notifications]
verify_jwt = false
